name: Auto Process DNS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */1 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          ref: main # Rất quan trọng: Ép tải thẳng nhánh main

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện
        run: pip install requests

      - name: Chạy script xử lý
        run: python z_code_process_dns.py

      - name: Lưu file vào Repo
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add dns_VN.txt
          
          if git diff --staged --quiet; then
            echo "Không có thay đổi nào mới."
          else
            # Thêm múi giờ VN để commit log chuẩn xác
            TZ='Asia/Ho_Chi_Minh' git commit -m "Cập nhật IP: $(TZ='Asia/Ho_Chi_Minh' date +'%d-%m-%Y %H:%M')"
            git push origin main
          fi
