name: Auto Process DNS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện
        run: pip install requests

      - name: Chạy script xử lý
        # Đảm bảo tên file python ở đây khớp với tên file của bạn trong repo
        run: python z_code_process_dns.py

      - name: Lưu file vào Repo
        run: |
          # 1. Sử dụng danh tính chuẩn của GitHub Actions Bot (Best Practice)
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 2. Thêm file mới tạo vào staging
          git add dns_VN.txt
          
          # 3. Kiểm tra thay đổi, nếu có thì commit và push
          if git diff --staged --quiet; then
            echo "Không có thay đổi nào mới."
          else
            git commit -m "Cập nhật IP: $(date +'%d-%m-%Y %H:%M')"
            
            # 4. Dùng cú pháp đẩy thẳng commit hiện tại (HEAD) lên nhánh main của origin
            # Cú pháp này miễn nhiễm với lỗi "detached HEAD"
            git push origin HEAD:main
          fi
