- name: Lưu file vào Repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 1. Thêm file vào vùng chờ (stage)
          git add dns_VN.txt
          
          # 2. Kiểm tra xem có gì mới không để tránh commit rác
          if git diff --staged --quiet; then
            echo "Không có thay đổi nào để cập nhật."
          else
            # 3. Commit thay đổi nội bộ
            git commit -m "Cập nhật list DNS: $(date +'%d-%m-%Y %H:%M')"
            
            # 4. QUAN TRỌNG: Kéo dữ liệu mới nhất từ server về và đặt commit của Action lên trên đầu
            # Việc dùng --rebase giúp lịch sử Git sạch hơn và tránh lỗi 'rejected'
            git pull origin main --rebase
            
            # 5. Đẩy lên lại
            git push origin main
          fi
