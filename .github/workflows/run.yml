name: Auto Process DNS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện
        run: pip install requests

      - name: Chạy script xử lý
        run: python z_code_process_dns.py

      - name: Lưu file vào Repo
        run: |
          # Cấu hình danh tính
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Đảm bảo đang ở đúng nhánh main để tránh lỗi 'ambiguous'
          git checkout main || git checkout -b main

          # Kiểm tra thay đổi
          git add dns_VN.txt
          if git diff --staged --quiet; then
            echo "Không có thay đổi nào mới."
          else
            git commit -m "Cập nhật IP: $(date +'%d-%m-%Y %H:%M')"
            
            # Sử dụng cú pháp push tường minh để tránh nhầm lẫn 'origin'
            # Cấu trúc: git push <URL_remote> <nhánh_local>:<nhánh_remote>
            git push "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main:main
          fi
