name: Auto Process DNS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện
        run: pip install requests

      - name: Chạy script xử lý
        run: python z_code_process_dns.py

      - name: Lưu file vào Repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Thêm file vào stage trước
          git add dns_VN.txt

          # Chỉ xử lý nếu có sự thay đổi
          if git diff --staged --quiet; then
            echo "Không có thay đổi nào mới."
          else
            # Commit thay đổi
            git commit -m "Cập nhật list DNS: $(date +'%d-%m-%Y %H:%M')"
            
            # Kéo và đẩy dữ liệu một cách an toàn
            # Sử dụng --rebase và chỉ định rõ nhánh để tránh lỗi ambiguous
            git pull --rebase origin main
            git push origin main
          fi
