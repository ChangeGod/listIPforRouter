name: Auto Process DNS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Cài đặt Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện
        run: pip install requests

      - name: Chạy script xử lý
        run: python z_code_process_dns.py

      - name: Lưu file vào Repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add dns_VN.txt
          
          if git diff --staged --quiet; then
            echo "Không có thay đổi."
          else
            # Fix lỗi rejected bằng commit -> pull rebase -> push
            git commit -m "Cập nhật list DNS kèm chú thích: $(date +'%d-%m-%Y %H:%M')"
            git pull origin main --rebase
            git push origin main
          fi
