name: Auto Process DNS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Cài đặt Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Chạy script xử lý
        run: python z_code_process_dns.py

      - name: Lưu file vào Repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Kiểm tra xem file có thay đổi không
          git add dns_VN.txt
          if git diff --staged --quiet; then
            echo "Không có thay đổi nào mới về IP."
          else
            # Pull trước khi push để tránh lỗi out-of-date
            git pull origin main --rebase
            git commit -m "Cập nhật danh sách IP: $(date +'%d-%m-%Y %H:%M')"
            git push origin main
          fi
